<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publishers Monthly Report</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f1f5f9;
  font-family: Arial, sans-serif;
  color: #1e293b;
}

.container {
  max-width: 480px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  font-size: 23px;
  margin-top: 0;
  color: #1d4ed8;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 24px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 7px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 2px rgba(37,99,235,.15);
}

.fsg-box {
  background: #eff6ff;
  padding: 12px;
  margin-top: 8px;
  border-radius: 8px;
  color: #1d4ed8;
  font-weight: bold;
}

.help {
  font-size: 13px;
  color: #64748b;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 24px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #94a3b8;
}

.message {
  margin-top: 16px;
  padding: 12px;
  border-radius: 8px;
  display: none;
  text-align: center;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.hidden {
  display: none;
}

.required {
  color: #dc2626;
}

</style>
</head>

<body>

<div class="container">

<h1>Publishers Monthly Report</h1>

<div class="subtitle">
Monthly Field Service Report
</div>

<form id="reportForm">

<label>
1. Publisher Name <span class="required">*</span>
</label>

<input
  type="text"
  id="publisherName"
  list="publisherList"
  placeholder="Search publisher name"
  autocomplete="off"
  required
>

<datalist id="publisherList"></datalist>

<div id="fsgBox" class="fsg-box hidden">
FSG: <span id="fsgDisplay"></span>
</div>

<label>
2. Reporting Month <span class="required">*</span>
</label>

<input
  type="month"
  id="reportingMonth"
  required
>

<label>
3. Publisher Type <span class="required">*</span>
</label>

<select id="publisherType" required>
  <option value="">Select publisher type</option>
  <option value="Publisher">Publisher</option>
  <option value="Regular Pioneer">Regular Pioneer</option>
  <option value="Auxiliary Pioneer">Auxiliary Pioneer</option>
  <option value="Other">Other</option>
</select>

<label>
4. Hours
<span id="hoursRequired" class="required hidden">*</span>
</label>

<input
  type="number"
  id="hours"
  min="0"
  step="0.5"
  placeholder="Enter hours"
>

<div class="help" id="hoursHelp">
Optional for publishers. Required for pioneers.
</div>

<label>
5. Bible Studies
</label>

<input
  type="number"
  id="bibleStudies"
  min="0"
  step="1"
  placeholder="Number of Bible studies"
>

<label>
6. Remarks
</label>

<textarea
  id="remarks"
  placeholder="Optional remarks"
></textarea>

<button type="submit" id="submitButton">
SUBMIT REPORT
</button>

<div id="message" class="message"></div>

</form>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiuyI0MiiUR_PYyt4grh3-bTyFQOAeHA3VBBfYLTwjr_2BVlZhXtNBvF9_aFAUeq_z/exec";

let publishers = [];

// Previous month default
function setPreviousMonth() {
  const now = new Date();

  const previousMonth = new Date(
    now.getFullYear(),
    now.getMonth() - 1,
    1
  );

  const year = previousMonth.getFullYear();
  const month = String(
    previousMonth.getMonth() + 1
  ).padStart(2, "0");

  document.getElementById("reportingMonth").value =
    `${year}-${month}`;
}

// Load publisher list using JSONP
function loadPublishers() {

  const callbackName =
    "publisherCallback_" + Date.now();

  window[callbackName] = function(data) {

    delete window[callbackName];

    if (!data.success) {
      showMessage(
        "Unable to load publishers.",
        false
      );
      return;
    }

    publishers = data.publishers || [];

    const datalist =
      document.getElementById("publisherList");

    datalist.innerHTML = "";

    publishers.forEach(publisher => {

      const option = document.createElement("option");

      option.value = publisher.name;

      datalist.appendChild(option);

    });

  };

  const script = document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?action=getPublishers&callback=" +
    callbackName;

  script.onerror = function() {
    showMessage(
      "Unable to connect. Please refresh the page.",
      false
    );
  };

  document.body.appendChild(script);
}

// Display FSG when publisher is selected
document.getElementById("publisherName")
.addEventListener("input", function() {

  const selectedName = this.value.trim();

  const publisher = publishers.find(
    p => p.name === selectedName
  );

  const fsgBox =
    document.getElementById("fsgBox");

  if (publisher) {

    document.getElementById("fsgDisplay")
      .textContent = publisher.fsg || "Not assigned";

    fsgBox.classList.remove("hidden");

  } else {

    fsgBox.classList.add("hidden");

  }

});

// Pioneer hours validation
document.getElementById("publisherType")
.addEventListener("change", function() {

  const pioneer =
    this.value === "Regular Pioneer" ||
    this.value === "Auxiliary Pioneer";

  const hoursInput =
    document.getElementById("hours");

  const requiredIndicator =
    document.getElementById("hoursRequired");

  if (pioneer) {

    hoursInput.required = true;

    requiredIndicator.classList.remove("hidden");

    document.getElementById("hoursHelp")
      .textContent = "Hours are required for pioneers.";

  } else {

    hoursInput.required = false;

    requiredIndicator.classList.add("hidden");

    document.getElementById("hoursHelp")
      .textContent =
      "Optional for publishers.";

  }

});

// Display messages
function showMessage(text, success) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + (success ? "success" : "error");

  message.style.display = "block";

}

// Submit report
document.getElementById("reportForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const publisherName =
    document.getElementById("publisherName").value.trim();

  const publisher =
    publishers.find(p => p.name === publisherName);

  if (!publisher) {
    showMessage(
      "Please select a valid publisher from the list.",
      false
    );
    return;
  }

  const reportingMonth =
    document.getElementById("reportingMonth").value;

  const publisherType =
    document.getElementById("publisherType").value;

  const hours =
    document.getElementById("hours").value;

  const bibleStudies =
    document.getElementById("bibleStudies").value;

  const remarks =
    document.getElementById("remarks").value.trim();

  const pioneer =
    publisherType === "Regular Pioneer" ||
    publisherType === "Auxiliary Pioneer";

  if (pioneer && hours === "") {
    showMessage(
      "Please enter your hours.",
      false
    );
    return;
  }

  const submitButton =
    document.getElementById("submitButton");

  submitButton.disabled = true;

  submitButton.textContent = "Submitting...";

  const params = new URLSearchParams();

  params.append("publisherName", publisherName);
  params.append("reportingMonth", reportingMonth);
  params.append("publisherType", publisherType);
  params.append("hours", hours);
  params.append("bibleStudies", bibleStudies);
  params.append("remarks", remarks);

  try {

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body: params.toString()
    });

    showMessage(
      "Your report has been sent. Please contact your coordinator if you need to confirm submission.",
      true
    );

    document.getElementById("reportForm").reset();

    setPreviousMonth();

    document.getElementById("fsgBox")
      .classList.add("hidden");

  } catch (error) {

    showMessage(
      "Submission failed. Please try again.",
      false
    );

  } finally {

    submitButton.disabled = false;

    submitButton.textContent = "SUBMIT REPORT";

  }

});

// Initialize
setPreviousMonth();
loadPublishers();

</script>

</body>
</html>
