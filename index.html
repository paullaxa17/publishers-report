<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JW Publishers Monthly Report</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: Arial, Helvetica, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  max-width: 480px;
  margin: 20px auto;
  padding: 24px;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.header {
  text-align: center;
  margin-bottom: 24px;
}

.header h1 {
  font-size: 24px;
  margin: 0 0 8px;
}

.header p {
  color: #64748b;
  font-size: 14px;
  margin: 0;
}

label {
  display: block;
  font-weight: 600;
  margin-top: 18px;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  background: #ffffff;
  color: #1e293b;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #2563eb;
  border-color: #2563eb;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

.fsg-box {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 9px;
  padding: 13px;
  margin-top: 5px;
  color: #1d4ed8;
  font-weight: 600;
}

.help {
  font-size: 13px;
  color: #64748b;
  margin-top: 6px;
}

.required {
  color: #dc2626;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 24px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

button:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 9px;
  font-size: 14px;
  line-height: 1.5;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.info {
  display: block;
  background: #dbeafe;
  color: #1e40af;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  margin-top: 22px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <h1>Governor Forbes Publishers Report - S21</h1>

    <p>Submit your monthly field service report</p>

  </div>

  <form id="reportForm">

    <!-- PUBLISHER NAME -->

    <label for="publisher">
      Publisher Name <span class="required">*</span>
    </label>

    <select id="publisher" required>

      <option value="">Loading publishers...</option>

    </select>

    <!-- FSG -->

    <label>Field Service Group</label>

    <div id="fsgDisplay" class="fsg-box">

      Select your name first

    </div>

    <!-- REPORTING MONTH -->

    <label for="month">
      Reporting Month <span class="required">*</span>
    </label>

    <input
      type="month"
      id="month"
      required
    >

    <!-- PUBLISHER TYPE -->

    <label for="publisherType">
      Publisher Type <span class="required">*</span>
    </label>

    <select id="publisherType" required>

      <option value="">Select publisher type</option>

      <option value="Publisher">
        Publisher
      </option>

      <option value="Regular Pioneer">
        Regular Pioneer
      </option>

      <option value="Auxiliary Pioneer">
        Auxiliary Pioneer
      </option>

    </select>

    <!-- HOURS -->

    <label for="hours">

      Hours

      <span id="hoursRequired" class="required hidden">
        *
      </span>

    </label>

    <input
      type="number"
      id="hours"
      min="0"
      step="0.25"
      placeholder="Enter hours"
    >

    <div id="hoursHelp" class="help">

      Optional for publishers. Required for pioneers.

    </div>

    <!-- BIBLE STUDIES -->

    <label for="studies">
      Bible Studies
    </label>

    <input
      type="number"
      id="studies"
      min="0"
      step="1"
      placeholder="Optional"
    >

    <!-- REMARKS -->

    <label for="remarks">
      Remarks
    </label>

    <textarea
      id="remarks"
      placeholder="Optional remarks"
    ></textarea>

    <!-- SUBMIT -->

    <button
      type="submit"
      id="submitButton"
    >

      Submit Report

    </button>

    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>

  </form>

  <div class="footer">

    Publishers Monthly Reporting System

  </div>

</div>

<script>

// ==========================================
// GOOGLE APPS SCRIPT URL
// ==========================================

const SCRIPT_URL ="https://script.google.com/macros/s/AKfycbxiuyI0MiiUR_PYyt4grh3-bTyFQOAeHA3VBBfYLTwjr_2BVlZhXtNBvF9_aFAUeq_z/exec";

// ==========================================
// ELEMENTS
// ==========================================

const publisherSelect =
document.getElementById("publisher");

const fsgDisplay =
document.getElementById("fsgDisplay");

const publisherType =
document.getElementById("publisherType");

const hoursInput =
document.getElementById("hours");

const hoursHelp =
document.getElementById("hoursHelp");

const hoursRequired =
document.getElementById("hoursRequired");

const studiesInput =
document.getElementById("studies");

const remarksInput =
document.getElementById("remarks");

const monthInput =
document.getElementById("month");

const submitButton =
document.getElementById("submitButton");

const message =
document.getElementById("message");

const form =
document.getElementById("reportForm");

// ==========================================
// VARIABLES
// ==========================================

let publishers = [];

let submitting = false;

// ==========================================
// DEFAULT REPORTING MONTH
// ==========================================

function setCurrentMonth() {

  const now = new Date();

  const year = now.getFullYear();

  const month = String(
    now.getMonth() + 1
  ).padStart(2, "0");

  monthInput.value =
    year + "-" + month;

}

setCurrentMonth();

// ==========================================
// JSONP REQUEST
// ==========================================

function jsonp(url, callback) {

  const callbackName =
    "callback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 1000000);

  const script =
    document.createElement("script");

  let finished = false;

  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      delete window[callbackName];

      script.remove();

      callback({
        success: false,
        message: "Request timed out"
      });

    }, 15000);

  window[callbackName] =
  function(data) {

    if (finished) return;

    finished = true;

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    callback(data);

  };

  script.onerror =
  function() {

    if (finished) return;

    finished = true;

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    callback({
      success: false,
      message: "Unable to connect to Google Sheets"
    });

  };

  script.src =
    url +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);

}

// ==========================================
// LOAD PUBLISHERS
// ==========================================

function loadPublishers() {

  publisherSelect.innerHTML =
    '<option value="">Loading publishers...</option>';

  jsonp(
    SCRIPT_URL + "?action=publishers",
    function(data) {

      if (!data || !data.success) {

        publisherSelect.innerHTML =
          '<option value="">Unable to load publishers</option>';

        showMessage(
          "Unable to load publisher list. Please refresh the page.",
          "error"
        );

        return;

      }

      publishers =
        data.publishers || [];

      publisherSelect.innerHTML =
        '<option value="">Select your name</option>';

      publishers.forEach(function(publisher) {

        const option =
          document.createElement("option");

        option.value =
          publisher.name;

        option.textContent =
          publisher.name;

        publisherSelect.appendChild(option);

      });

    }
  );

}

// ==========================================
// SELECT PUBLISHER
// ==========================================

publisherSelect.addEventListener(
  "change",
  function() {

    const selectedPublisher =
      publishers.find(function(publisher) {

        return publisher.name ===
          publisherSelect.value;

      });

    if (selectedPublisher) {

      fsgDisplay.textContent =
        selectedPublisher.fsg ||
        "FSG not assigned";

      // Automatically populate type
      // if master database has a type

      if (selectedPublisher.type) {

        publisherType.value =
          selectedPublisher.type;

        updateHoursRequirement();

      }

    } else {

      fsgDisplay.textContent =
        "Select your name first";

      publisherType.value = "";

      updateHoursRequirement();

    }

  }
);

// ==========================================
// HOURS REQUIREMENT
// ==========================================

function updateHoursRequirement() {

  const type =
    publisherType.value;

  const isPioneer =
    type === "Regular Pioneer" ||
    type === "Auxiliary Pioneer";

  hoursInput.required =
    isPioneer;

  hoursRequired.classList.toggle(
    "hidden",
    !isPioneer
  );

  hoursHelp.textContent =
    isPioneer
      ? "Hours are required for this publisher type."
      : "Hours are optional for publishers.";

}

publisherType.addEventListener(
  "change",
  updateHoursRequirement
);

// ==========================================
// MESSAGE DISPLAY
// ==========================================

function showMessage(text, type) {

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}

function hideMessage() {

  message.className =
    "message";

  message.textContent =
    "";

  message.style.display =
    "none";

}

// ==========================================
// DUPLICATE CHECK
// ==========================================

function checkDuplicate(
  publisherName,
  month,
  callback
) {

  const url =
    SCRIPT_URL +
    "?action=check" +
    "&name=" +
    encodeURIComponent(publisherName) +
    "&month=" +
    encodeURIComponent(month);

  jsonp(url, callback);

}

// ==========================================
// SUBMISSION
// ==========================================

form.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    if (submitting) return;

    hideMessage();

    // --------------------------------------
    // VALIDATE PUBLISHER
    // --------------------------------------

    const selectedPublisher =
      publishers.find(function(publisher) {

        return publisher.name ===
          publisherSelect.value;

      });

    if (!selectedPublisher) {

      showMessage(
        "Please select your publisher name.",
        "error"
      );

      return;

    }

    // --------------------------------------
    // VALIDATE MONTH
    // --------------------------------------

    const month =
      monthInput.value;

    if (!month) {

      showMessage(
        "Please select the reporting month.",
        "error"
      );

      return;

    }

    // --------------------------------------
    // VALIDATE TYPE
    // --------------------------------------

    const type =
      publisherType.value;

    if (!type) {

      showMessage(
        "Please select your publisher type.",
        "error"
      );

      return;

    }

    // --------------------------------------
    // VALIDATE HOURS
    // --------------------------------------

    const hours =
      hoursInput.value;

    const isPioneer =
      type === "Regular Pioneer" ||
      type === "Auxiliary Pioneer";

    if (isPioneer && hours === "") {

      showMessage(
        "Hours are required for Regular Pioneers and Auxiliary Pioneers.",
        "error"
      );

      hoursInput.focus();

      return;

    }

    if (
      hours !== "" &&
      (
        Number(hours) < 0 ||
        isNaN(Number(hours))
      )
    ) {

      showMessage(
        "Please enter valid hours.",
        "error"
      );

      return;

    }

    // --------------------------------------
    // VALIDATE BIBLE STUDIES
    // --------------------------------------

    const studies =
      studiesInput.value;

    if (
      studies !== "" &&
      (
        Number(studies) < 0 ||
        !Number.isInteger(Number(studies))
      )
    ) {

      showMessage(
        "Bible Studies must be a whole number.",
        "error"
      );

      return;

    }

    // --------------------------------------
    // REPORT DATA
    // --------------------------------------

    const report = {

      publisherName:
        selectedPublisher.name,

      fsg:
        selectedPublisher.fsg,

      month:
        month,

      publisherType:
        type,

      hours:
        hours === ""
          ? ""
          : Number(hours),

      bibleStudies:
        studies === ""
          ? ""
          : Number(studies),

      remarks:
        remarksInput.value.trim()

    };

    // --------------------------------------
    // DISABLE SUBMIT
    // --------------------------------------

    submitting = true;

    submitButton.disabled =
      true;

    submitButton.textContent =
      "Checking report...";

    // --------------------------------------
    // CHECK DUPLICATE FIRST
    // --------------------------------------

    checkDuplicate(
      report.publisherName,
      report.month,
      function(result) {

        if (!result || result.success === false) {

          showMessage(
            "Unable to verify duplicate reports. Please try again.",
            "error"
          );

          resetSubmitButton();

          return;

        }

        if (result.exists) {

          showMessage(
            "You already submitted a report for " +
            report.month +
            ". Duplicate reports are not allowed.",
            "error"
          );

          resetSubmitButton();

          return;

        }

        // ----------------------------------
        // SUBMIT REPORT
        // ----------------------------------

        submitButton.textContent =
          "Submitting report...";

        submitReport(report);

      }
    );

  }
);

// ==========================================
// SUBMIT TO GOOGLE APPS SCRIPT
// ==========================================

function submitReport(report) {

  fetch(SCRIPT_URL, {

    method: "POST",

    mode: "no-cors",

    headers: {

      "Content-Type":
        "text/plain;charset=utf-8"

    },

    body: JSON.stringify(report)

  })
  .then(function() {

    // Because no-cors cannot read Google's response,
    // verify by checking the Responses sheet.

    submitButton.textContent =
      "Verifying submission...";

    verifySubmission(report);

  })
  .catch(function() {

    showMessage(
      "Unable to send your report. Please check your internet connection and try again.",
      "error"
    );

    resetSubmitButton();

  });

}

// ==========================================
// VERIFY SAVED REPORT
// ==========================================

function verifySubmission(report) {

  checkDuplicate(
    report.publisherName,
    report.month,
    function(result) {

      if (
        result &&
        result.success &&
        result.exists
      ) {

        showMessage(
          "Report submitted successfully!\n\n" +
          "Publisher: " +
          report.publisherName +
          "\nMonth: " +
          report.month +
          "\nFSG: " +
          (report.fsg || "Unassigned") +
          "\n\nThank you for submitting your monthly report.",
          "success"
        );

        form.reset();

        setCurrentMonth();

        fsgDisplay.textContent =
          "Select your name first";

        updateHoursRequirement();

      } else {

        showMessage(
          "We could not confirm that your report was saved. Please check your submission in a moment or contact your group overseer.",
          "error"
        );

      }

      resetSubmitButton();

    }
  );

}

// ==========================================
// RESET BUTTON
// ==========================================

function resetSubmitButton() {

  submitting = false;

  submitButton.disabled =
    false;

  submitButton.textContent =
    "Submit Report";

}

// ==========================================
// INITIALIZE 
// ==========================================

updateHoursRequirement();

loadPublishers();

</script>

</body>
</html>
