<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publishers Report</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f5f8;
  margin: 0;
  padding: 20px;
  color: #263445;
}

.container {
  max-width: 480px;
  margin: 25px auto;
  background: white;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  color: #234d78;
  margin-bottom: 8px;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
  font-size: 14px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 8px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d0d7de;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

input[readonly] {
  background: #f5f7f9;
  color: #555;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  background: #234d78;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #8799aa;
  cursor: wait;
}

.message {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  line-height: 1.5;
}

.success {
  background: #e8f5e9;
  color: #216e39;
}

.error {
  background: #ffebee;
  color: #b71c1c;
}

.info {
  background: #e3f2fd;
  color: #154c79;
}

.footer {
  text-align: center;
  margin-top: 20px;
  color: #999;
  font-size: 12px;
}

.loading {
  color: #777;
  font-size: 14px;
  text-align: center;
  margin-top: 10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Publishers Report</h1>

<div class="subtitle">
Monthly Field Service Report
</div>

<form id="reportForm">

<!-- Publisher Combo Box -->

<label for="name">Publisher's Name</label>

<input
  type="text"
  id="name"
  list="publisherList"
  placeholder="Search or select publisher"
  autocomplete="off"
  required
>

<datalist id="publisherList"></datalist>

<div id="loadingMessage" class="loading">
Loading publisher list...
</div>

<!-- Publisher Type -->

<label for="type">Type of Publisher</label>

<input
  type="text"
  id="type"
  readonly
  placeholder="Automatically displayed"
>

<!-- Field Service Group -->

<label for="group">Field Service Group</label>

<input
  type="text"
  id="group"
  readonly
  placeholder="Automatically displayed"
>

<!-- Reporting Month -->

<label for="month">Reporting Month</label>

<input
  type="month"
  id="month"
  required
>

<!-- Hours -->

<label for="hours">Hours</label>

<input
  type="number"
  id="hours"
  min="0"
  step="0.5"
  placeholder="Enter hours"
  required
>

<!-- Bible Studies -->

<label for="studies">Bible Studies</label>

<input
  type="number"
  id="studies"
  min="0"
  step="1"
  placeholder="Number of Bible studies"
  required
>

<!-- Remarks -->

<label for="remarks">Remarks (Optional)</label>

<textarea
  id="remarks"
  placeholder="Additional information"
></textarea>

<!-- Submit -->

<button type="submit" id="submitButton">
SUBMIT REPORT
</button>

</form>

<!-- Messages -->

<div id="successMessage" class="message success"></div>

<div id="errorMessage" class="message error"></div>

<div id="infoMessage" class="message info"></div>

<div class="footer">
Monthly Field Service Report
</div>

</div>

<script>

// ========================================
// GOOGLE APPS SCRIPT WEB APP URL
// ========================================

const scriptURL = "https://script.google.com/macros/s/AKfycbxiuyI0MiiUR_PYyt4grh3-bTyFQOAeHA3VBBfYLTwjr_2BVlZhXtNBvF9_aFAUeq_z/exec";

// ========================================
// ELEMENTS
// ========================================

const form = document.getElementById("reportForm");

const nameInput = document.getElementById("name");

const publisherList = document.getElementById("publisherList");

const typeInput = document.getElementById("type");

const groupInput = document.getElementById("group");

const monthInput = document.getElementById("month");

const submitButton = document.getElementById("submitButton");

const loadingMessage = document.getElementById("loadingMessage");

// ========================================
// DATA
// ========================================

let publishers = [];

// ========================================
// DEFAULT REPORTING MONTH
// ========================================

const now = new Date();

monthInput.value =
  now.getFullYear() + "-" +
  String(now.getMonth() + 1).padStart(2, "0");

// ========================================
// JSONP CONNECTION
// ========================================

function jsonp(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_" + Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    const query = new URLSearchParams({
      ...params,
      callback: callbackName
    });

    script.src = scriptURL + "?" + query.toString();

    window[callbackName] = function(data) {

      resolve(data);

      script.remove();

      delete window[callbackName];

    };

    script.onerror = function() {

      reject(
        new Error("Unable to connect to report system.")
      );

      script.remove();

      delete window[callbackName];

    };

    document.body.appendChild(script);

    setTimeout(() => {

      if (window[callbackName]) {

        delete window[callbackName];

        script.remove();

        reject(
          new Error("Connection timed out.")
        );

      }

    }, 15000);

  });

}

// ========================================
// LOAD PUBLISHERS
// ========================================

async function loadPublishers() {

  try {

    const result = await jsonp({
      action: "publishers"
    });

    if (!result.success) {

      throw new Error("Unable to load publishers.");

    }

    publishers = result.publishers || [];

    publisherList.innerHTML = "";

    publishers.forEach(publisher => {

      const option = document.createElement("option");

      // Publisher names only - NO FSG
      option.value = publisher.name;

      publisherList.appendChild(option);

    });

    loadingMessage.style.display = "none";

  } catch (error) {

    loadingMessage.textContent =
      "Unable to load publisher list. Please refresh the page.";

    showError(
      "Unable to load publisher list. Please refresh the page."
    );

  }

}

// ========================================
// PUBLISHER SELECTION
// ========================================

nameInput.addEventListener("input", function() {

  const selectedName = nameInput.value.trim();

  const publisher = publishers.find(
    p => p.name.toLowerCase() ===
         selectedName.toLowerCase()
  );

  if (publisher) {

    typeInput.value = publisher.type;

    groupInput.value = publisher.group;

  } else {

    typeInput.value = "";

    groupInput.value = "";

  }

});

// ========================================
// DUPLICATE CHECK
// ========================================

async function checkReport(name, month) {

  return await jsonp({
    action: "check",
    name: name,
    month: month
  });

}

// ========================================
// FORM SUBMISSION
// ========================================

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  hideMessages();

  const name = nameInput.value.trim();

  const month = monthInput.value;

  const hours = document.getElementById("hours").value;

  const studies = document.getElementById("studies").value;

  const remarks = document.getElementById("remarks").value.trim();

  // Validate publisher against official database

  const publisher = publishers.find(
    p => p.name.toLowerCase() === name.toLowerCase()
  );

  if (!publisher) {

    showError(
      "Please select a valid publisher from the official list."
    );

    nameInput.focus();

    return;

  }

  if (!month) {

    showError("Please select the reporting month.");

    return;

  }

  if (hours === "" || studies === "") {

    showError(
      "Please enter both Hours and Bible Studies."
    );

    return;

  }

  if (Number(hours) < 0 || Number(studies) < 0) {

    showError("Values cannot be negative.");

    return;

  }

  submitButton.disabled = true;

  submitButton.textContent = "Checking report...";

  try {

    // Check duplicate report

    const check = await checkReport(name, month);

    if (!check.success) {

      throw new Error(
        check.message || "Unable to verify report."
      );

    }

    if (check.duplicate) {

      showError(
        "A report for " + month +
        " has already been submitted by " + name +
        ". Please contact your report administrator if you need to make a correction."
      );

      submitButton.disabled = false;

      submitButton.textContent = "SUBMIT REPORT";

      return;

    }

    // Submit data

    submitButton.textContent = "Submitting...";

    const data = {

      name: publisher.name,

      month: month,

      hours: Number(hours),

      studies: Number(studies),

      remarks: remarks

    };

    await fetch(scriptURL, {

      method: "POST",

      mode: "no-cors",

      headers: {

        "Content-Type": "text/plain;charset=utf-8"

      },

      body: JSON.stringify(data)

    });

    // Confirmation

    showSuccess(
      "Your report has been submitted. Thank you!"
    );

    form.reset();

    // Restore current month

    monthInput.value =
      now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0");

    typeInput.value = "";

    groupInput.value = "";

  } catch (error) {

    showError(
      "Unable to submit your report. Please try again or contact your report administrator."
    );

  }

  submitButton.disabled = false;

  submitButton.textContent = "SUBMIT REPORT";

});

// ========================================
// MESSAGE FUNCTIONS
// ========================================

function showSuccess(message) {

  const element = document.getElementById("successMessage");

  element.textContent = message;

  element.style.display = "block";

}

function showError(message) {

  const element = document.getElementById("errorMessage");

  element.textContent = message;

  element.style.display = "block";

}

function hideMessages() {

  document.getElementById("successMessage").style.display = "none";

  document.getElementById("errorMessage").style.display = "none";

  document.getElementById("infoMessage").style.display = "none";

}

// ========================================
// INITIALIZATION
// ========================================

loadPublishers();

</script>

</body>
</html>
